{% extends "base.html" %}
{% block title %}{{ titulo }} - Portal de Triagem{% endblock %}
{% block content %}
<section class="card">
  <div class="heading-row">
    <div class="heading-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    </div>
    <div><h1>{{ titulo }}</h1></div>
  </div>

  <div class="alert alert-warning">
    <svg class="alert-icon" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10" fill="#c8102e" opacity="0.15"/><circle cx="12" cy="12" r="10" fill="none" stroke="#c8102e" stroke-width="1.5"/><path d="M12 8v4M12 16h.01" stroke="#c8102e" stroke-width="2" stroke-linecap="round"/></svg>
    <span>{{ mensagem }}</span>
  </div>

  <p>Se preferir, você pode retornar imediatamente para a fila de atendimento humano.</p>
  <div class="actions">
    <a class="btn btn-primary" href="/atendente">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6A19.79 19.79 0 012.12 4.18 2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
      Falar com atendente
    </a>
  </div>
</section>
{% endblock %}
